[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-charts"
version = "0.2.0"
description = "The Liminal chart app: the chart page and its data views, served by a front that funnels every request to the fetcher (liminal-integrator), on liminal-libs."
readme = "README.md"
requires-python = ">=3.10"
# the library (the stores, the plugin contract, the collector, the scheme: liminal-libs) brings the
# data dependencies (pandas below 3.1, numpy, requests, exchange_calendars, duckdb, pymongo, plotly)
dependencies = [
    "liminal-libs @ git+https://github.com/pcxmac-dev/liminal-libs@release/0.2.0",  # 1.42.0: touch.js (touch screens, the on-screen keyboard); since 1.7.0: the class contract (API 2.0), the plugin selection, the core classes, the data specs (API 2.1), the apps' frame, renamed
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# the fetcher, released on its own (the app's pages get their data through it)
integrator = ["liminal-integrator @ git+https://github.com/pcxmac-dev/liminal-integrator@release/0.2.0"]  # 1.4.0: --plugins, --name
login = ["liminal-login @ git+https://github.com/pcxmac-dev/liminal-login@main"]  # the login app the front binds (sign in, your keys)
# the plugins released on their own, from their tags (docs/ARCHITECTURE.md: Providers are plugins)
plugins = [
    "plugin-integrator-cboe @ git+https://github.com/pcxmac-dev/plugin-integrator-cboe@release/0.2.0",
    "plugin-integrator-bitstamp @ git+https://github.com/pcxmac-dev/plugin-integrator-bitstamp@release/0.2.0",
    "plugin-integrator-coinbase @ git+https://github.com/pcxmac-dev/plugin-integrator-coinbase@release/0.2.0",
    "plugin-integrator-bitfinex @ git+https://github.com/pcxmac-dev/plugin-integrator-bitfinex@release/0.2.0",
    "plugin-integrator-tiingo @ git+https://github.com/pcxmac-dev/plugin-integrator-tiingo@release/0.2.0",
    "plugin-integrator-french @ git+https://github.com/pcxmac-dev/plugin-integrator-french@release/0.2.0",
    "plugin-integrator-datahub @ git+https://github.com/pcxmac-dev/plugin-integrator-datahub@release/0.2.0",
    "plugin-integrator-federal @ git+https://github.com/pcxmac-dev/plugin-integrator-federal@release/0.2.0",
    "plugin-integrator-alpaca @ git+https://github.com/pcxmac-dev/plugin-integrator-alpaca@release/0.2.0",
    "plugin-integrator-massive @ git+https://github.com/pcxmac-dev/plugin-integrator-massive@release/0.2.0",
    "plugin-integrator-twse @ git+https://github.com/pcxmac-dev/plugin-integrator-twse@release/0.2.0",
    "plugin-integrator-b3 @ git+https://github.com/pcxmac-dev/plugin-integrator-b3@release/0.2.0",
    "plugin-integrator-alphavantage @ git+https://github.com/pcxmac-dev/plugin-integrator-alphavantage@release/0.2.0",
    "plugin-integrator-jquants @ git+https://github.com/pcxmac-dev/plugin-integrator-jquants@release/0.2.0",
    "plugin-integrator-twelvedata @ git+https://github.com/pcxmac-dev/plugin-integrator-twelvedata@release/0.2.0",
    # the AI assistants (platform plugins: liminal_libs.assistants), each on its own key
    "plugin-platform-claude @ git+https://github.com/pcxmac-dev/plugin-platform-claude@release/0.2.0",
    "plugin-platform-grok @ git+https://github.com/pcxmac-dev/plugin-platform-grok@release/0.2.0",
    "plugin-platform-codex @ git+https://github.com/pcxmac-dev/plugin-platform-codex@release/0.2.0",
]

[project.scripts]
liminal-charts = "liminal_charts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal_charts = ["gui/static/*", "gui/static/vendor/klinecharts/*", "gui/static/vendor/world/*", "gui/static/vendor/sky/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
